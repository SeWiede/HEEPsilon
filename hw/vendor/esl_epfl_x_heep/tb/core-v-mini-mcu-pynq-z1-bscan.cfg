adapter driver ftdi
adapter speed 1000
transport select jtag

# Digilent FT2232H on PYNQ-Z1
# layout_init derived from Digilent Zybo (same Digilent FT2232H family).
# If OpenOCD fails to connect, try layout_init 0x0088 0x008b instead.
ftdi_vid_pid 0x0403 0x6010

ftdi_channel 0
ftdi_layout_init 0x0088 0x008b

reset_config none

echo "ftdi setting..."

# Same XC7Z020 as PYNQ-Z2: IRLEN and expected IDs are identical
set _CHIPNAME riscv
jtag newtap $_CHIPNAME cpu -irlen 6 -expected-id 0x23727093
jtag newtap arm_dap_0 tap -irlen 4 -expected-id 0x4ba00477

set _TARGETNAME $_CHIPNAME.cpu
target create $_TARGETNAME riscv -chain-position $_TARGETNAME -coreid 0x000

echo "target created..."

riscv set_ir idcode 0x09
riscv set_ir dtmcs 0x22
riscv set_ir dmi 0x23

riscv set_reset_timeout_sec 2000
riscv set_command_timeout_sec 2000

echo "setting preferences..."

scan_chain

init

echo "init routine started"

halt

echo "Ready for Remote Connections"
