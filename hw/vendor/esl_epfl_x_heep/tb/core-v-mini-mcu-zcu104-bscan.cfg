# OpenOCD configuration for ZCU104 (xczu7ev) via BSCANE2
#
# Requires bitstream built with:
#   make vivado-fpga FPGA_BOARD=zcu104 FUSESOC_FLAGS=--flag=use_bscane_xilinx
#
# BSCANE2 instances in dmi_bscane_tap.sv (confirmed from synthesis log):
#   JTAG_CHAIN=3 (USER3) → dtmcs register
#   JTAG_CHAIN=4 (USER4) → dmi register
#
# ZynqMP JTAG chain (accessed via FT4232H channel A = onboard USB cable):
#   TDI → [ARM DAP (irlen=4, id=0x5ba00477)] → [PL config tap (irlen=12)] → TDO
#
# USER instruction IR codes for xczu7ev (irlen=12), from BSDL:
#   xczu7ev_ffvc1156.bsd: USER3=100100100010=0x922, USER4=100100100011=0x923
#   The upper 6 bits are NOT zero — differs from the simple zero-extended 7-series values.
#   7-series (irlen=6): USER3=0x22, USER4=0x23  (different upper bits, same lower 6)
#
# UART — PL UART goes through FT4232H channel D (interface 3), same "USB JTAG UART" cable:
#   picocom -b 9600 -r -l --imap lfcrlf \
#     /dev/serial/by-id/usb-Xilinx_JTAG+3Serial_XXXXXXXX-if03-port0

adapter driver ftdi
adapter speed 500
transport select jtag

# ZCU104 FT4232H: VID:PID 0x0403:0x6011, JTAG on channel A (same USB cable as bitstream)
ftdi_vid_pid 0x0403 0x6011
ftdi_channel 0
ftdi_layout_init 0x0088 0x008b

reset_config none

echo "ZCU104 BSCANE2: connecting via FT4232H channel A..."

# ── JTAG chain ────────────────────────────────────────────────────────────────
# Tap 1 (TDI-side): ARM Cortex-A53 DAP
jtag newtap arm_dap xczu7ev -irlen 4 -ircapture 0x1 -irmask 0xf \
    -expected-id 0x5ba00477

# Tap 2 (TDO-side): ZynqMP PL/PS configuration tap — RISC-V DTM lives here via BSCANE2
# irlen=12; -ignore-version tolerates revision-bit differences across silicon steppings
set _CHIPNAME riscv
jtag newtap $_CHIPNAME cpu -irlen 12 -ircapture 0x1 -irmask 0x03 -ignore-version \
    -expected-id 0x04711093 \
    -expected-id 0x04710093 \
    -expected-id 0x04721093 \
    -expected-id 0x04720093 \
    -expected-id 0x04739093 \
    -expected-id 0x04730093 \
    -expected-id 0x04738093 \
    -expected-id 0x04740093 \
    -expected-id 0x04750093 \
    -expected-id 0x04759093 \
    -expected-id 0x04758093

# ── ZynqMP JTAG chain initialisation ─────────────────────────────────────────
# ZynqMP requires an explicit JTAG "add DAP to chain" sequence before any DR
# access works.  Without it the PL config tap returns 0 for all DR scans,
# including the BSCANE2 USER3/USER4 registers.
# Reference: https://forums.xilinx.com/t5/UltraScale-Architecture/JTAG-Chain-Configuration-for-Zynq-UltraScale-MPSoC/td-p/758924
set _zynqmp_initialized 0
jtag configure $_CHIPNAME.cpu -event setup {
    global _zynqmp_initialized
    if { $_zynqmp_initialized == 0 } {
        set _zynqmp_initialized 1
        irscan riscv.cpu 0x824
        drscan riscv.cpu 32 0x00000003
        runtest 100
        jtag arp_init
    }
}

# ── RISC-V target ─────────────────────────────────────────────────────────────
set _TARGETNAME $_CHIPNAME.cpu
target create $_TARGETNAME riscv -chain-position $_TARGETNAME -coreid 0x000

# Map RISC-V debug IR codes to UltraScale+ PL config tap USER instructions
riscv set_ir idcode 0x009
riscv set_ir dtmcs  0x922
riscv set_ir dmi    0x923

riscv set_reset_timeout_sec 2000
riscv set_command_timeout_sec 2000

scan_chain
init
halt
echo "Ready for Remote Connections"
