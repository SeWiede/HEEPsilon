# OpenOCD configuration for ZCU104 — RISC-V core via external JTAG cable on Pmod J87
#
# Use this when the bitstream was built WITHOUT --flag=use_bscane_xilinx.
# The RISC-V JTAG pins are exposed directly on Pmod J87 (Bank 26, LVCMOS33).
# Connect a Digilent HS2 (FT232H) or similar FTDI cable — NOT the onboard USB.
#
# Pmod J87 wiring:
#   Cable TCK  → FPGA H6
#   Cable TMS  → FPGA G7
#   Cable TDI  → FPGA H8
#   Cable TDO  → FPGA J6
#   Cable TRST → FPGA M9  (tie high if your cable has no TRST)
#   Cable GND  → J87 GND
#
# The exact physical pin numbers on J87 must be cross-referenced against the
# ZCU104 schematics (UG1267).  The FPGA pin → J87 connector mapping has not
# been verified on hardware.
#
# Default cable below is Digilent HS2 / Digilent SMT2 (FT232H, single-port).
# For an FT2232H mini-module use: ftdi_vid_pid 0x0403 0x6010
#                                  ftdi_layout_init 0x0088 0x008b
#
# UART — no adapter needed regardless of JTAG path:
#   picocom -b 115200 -r -l --imap lfcrlf \
#     /dev/serial/by-id/usb-FTDI_Quad_RS232-HS-if02-port0

adapter driver ftdi
adapter speed 1000
transport select jtag

# Digilent HS2 / SMT2 (FT232H single-channel)
ftdi_vid_pid 0x0403 0x6014
ftdi_channel 0
ftdi_layout_init 0x00e8 0x60eb

reset_config none

echo "ZCU104 external JTAG: connecting via Pmod J87..."

set _CHIPNAME riscv
jtag newtap $_CHIPNAME cpu -irlen 5 -expected-id 0x10001c05

set _TARGETNAME $_CHIPNAME.cpu
target create $_TARGETNAME riscv -chain-position $_TARGETNAME -coreid 0x000

riscv set_reset_timeout_sec 2000
riscv set_command_timeout_sec 2000

scan_chain
init
halt
echo "Ready for Remote Connections"
